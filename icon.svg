<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="#1e293b" stroke-width="4"/>
  <!-- Stylized T -->
  <path d="M160 150 h192 a16 16 0 0 1 0 32 h-80 v180 a16 16 0 0 1 -32 0 V182 h-80 a16 16 0 0 1 0 -32 z" fill="#2dd4bf"/>
  <!-- Upward chart / pulse line -->
  <path d="M120 340 L180 300 L230 320 L300 240 L360 270 L400 210" fill="none" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Small accent dots on the line -->
  <circle cx="180" cy="300" r="10" fill="#2dd4bf"/>
  <circle cx="300" cy="240" r="10" fill="#2dd4bf"/>
  <circle cx="400" cy="210" r="10" fill="#2dd4bf"/>
</svg>
