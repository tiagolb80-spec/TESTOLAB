<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" ry="98" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Syringe body (vertical) -->
  <g transform="translate(256, 256)">
    <!-- Barrel -->
    <rect x="-28" y="-90" width="56" height="160" rx="10" fill="#2dd4bf"/>
    <!-- Plunger rod -->
    <rect x="-8" y="-150" width="16" height="60" rx="4" fill="#2dd4bf"/>
    <!-- Plunger top -->
    <rect x="-22" y="-165" width="44" height="18" rx="6" fill="#2dd4bf"/>
    <!-- Needle base / hub -->
    <rect x="-14" y="70" width="28" height="22" rx="4" fill="#14b8a6"/>
    <!-- Needle -->
    <rect x="-3" y="90" width="6" height="55" rx="2" fill="#5eead4"/>
    <!-- Measurement lines on barrel -->
    <line x1="-18" y1="-50" x2="18" y2="-50" stroke="#0b1220" stroke-width="3"/>
    <line x1="-18" y1="-20" x2="18" y2="-20" stroke="#0b1220" stroke-width="3"/>
    <line x1="-18" y1="10" x2="18" y2="10" stroke="#0b1220" stroke-width="3"/>
    <line x1="-18" y1="40" x2="18" y2="40" stroke="#0b1220" stroke-width="3"/>
  </g>

  <!-- Upward chart / pulse line (subtle, behind/around) -->
  <path d="M90 360 L150 320 L200 340 L270 260 L340 290 L420 200" 
        fill="none" stroke="#2dd4bf" stroke-width="12" 
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- Small dots on the chart -->
  <circle cx="150" cy="320" r="8" fill="#2dd4bf" opacity="0.7"/>
  <circle cx="270" cy="260" r="8" fill="#2dd4bf" opacity="0.7"/>
  <circle cx="420" cy="200" r="8" fill="#2dd4bf" opacity="0.7"/>
</svg>
