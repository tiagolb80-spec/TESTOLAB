name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: capacitor/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: npm install

      - name: Prepare web app
        run: |
          mkdir -p capacitor/www
          cp index.html capacitor/www/index.html
          if [ -f icon.svg ]; then cp icon.svg capacitor/www/icon.svg; fi

      - name: Create Android project
        working-directory: capacitor
        run: npx cap add android

      - name: Sync Android project
        working-directory: capacitor
        run: npx cap sync android

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > capacitor/android/local.properties

      - name: Build debug APK
        working-directory: capacitor/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="capacitor/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: testolab-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
